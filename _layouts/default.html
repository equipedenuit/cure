<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <title>{{ page.title | default: site.title }}</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <!-- FAVICONS -->
  <link rel="icon" href="{{ '/favicon.ico?v=4' | relative_url }}" sizes="any">
  <link rel="icon" type="image/png" sizes="32x32" href="{{ '/favicon-32.png?v=4' | relative_url }}">
  <link rel="icon" type="image/png" sizes="16x16" href="{{ '/favicon-16.png?v=4' | relative_url }}">
  <link rel="apple-touch-icon" sizes="180x180" href="{{ '/apple-touch-icon.png?v=4' | relative_url }}">
  <meta name="theme-color" content="#ffffff">

  <!-- Le logo garde sa personnalité ; le reste du site utilise une pile système. -->
  <link href="https://fonts.googleapis.com/css2?family=Yuji+Syuku&display=swap" rel="stylesheet">

  <style>
    /* Typographie compacte, dans l'esprit des pages personnelles de la fin des années 1990. */
    body{
      font-family:Arial, Helvetica, "Liberation Sans", sans-serif;
      font-size:15px;
      max-width:680px;
      margin:0 auto;
      padding:1.75rem 1rem;
      line-height:1.55;
      color:#111;
      background:#fff;
    }

    /* Logo / Titre de site */
    .site-title{font-size:2rem;line-height:1.2;font-weight:700;text-align:center;margin:0 0 .25rem 0;letter-spacing:.2px}
    .site-title a{color:inherit;text-decoration:none;font-family:'Yuji Syuku',serif}
    .site-title a:visited{color:inherit}
    .emdash{margin:0 0 0 -52px;padding:0 7px 0 0;line-height:1.5}

    .subtitle{ text-align:center;font-style:italic;opacity:.8;margin:0 0 .8rem }

    /* Liens web 1.0 */
    a{color:#0000EE;text-decoration:underline}
    a:visited{color:#551A8B}

    /* Navigation compacte, dans l’esprit des pages personnelles de l’époque */
    .cats-wrapper{
      text-align:center; margin:.7rem 0 1.1rem;
      font-size:12px; line-height:1.4;
    }
    .cats-wrapper .cat-link{ color:#0000EE; text-decoration:underline }
    .cats-wrapper .sep{ margin:0 .4em; color:#777 }

    /* Articles */
    article{ margin:0 }
    article h2{ font-size:20px; line-height:1.3; font-weight:700; margin:.25rem 0 }
    .meta,.post-date{
      font-size:12px; line-height:1.35; color:#666; margin:.35rem 0 1.15rem;
    }
    hr{ border:0; border-top:1px solid #c9c9c9; margin:3.25rem 0 2.75rem }

    /* Lecture naturelle, sans espaces irréguliers entre les mots */
    .post-content{ text-align:left }

    /* Embeds responsives */
    iframe{ width:100%; max-width:100%; aspect-ratio:16/9; height:auto; display:block; margin:0 auto }
    img,video{ max-width:100%; height:auto; display:block; margin:0 auto }

    /* Fallback e-mail : caché côté web */
    @media screen { .email-preview{ display:none } }
    .layout-page .email-preview { display: none !important; }

    /* Formulaire d’abonnement */
    #subscribe{
      width:100%; margin:0 0 3rem; padding:0 0 1rem;
      box-sizing:border-box; border-bottom:1px solid #bdbdbd;
      font-size:12px; line-height:1.35;
    }
    #subscribe form{ display:flex; align-items:center; justify-content:flex-start; gap:8px; flex-wrap:nowrap }
    #subscribe .sub-label{ flex:0 0 auto; white-space:nowrap; margin:0; font-size:12px }
    #subscribe input[type="email"], #subscribe button{
      box-sizing:border-box; -webkit-appearance:none; appearance:none; border-radius:0;
      font-family:inherit; font-size:13px; line-height:1.2; min-height:34px;
    }
    #subscribe input[type="email"]{ flex:1 1 auto; min-width:0; padding:.4rem .55rem; border:1px solid #777; background:#fff; color:#000 }
    #subscribe button{ flex:0 0 auto; padding:.4rem .7rem; border:1px solid #777; background:#eee; color:#000; cursor:pointer; white-space:nowrap }
    #subscribe button:hover{ background:#ddd }
    #subscribe button:disabled{ background:#f5f5f5; color:#000; opacity:.6; cursor:not-allowed }
    @media (max-width:600px){
      #subscribe form{ flex-wrap:wrap }
      #subscribe .sub-label{ flex:1 1 100%; text-align:left; white-space:normal; margin-bottom:2px }
    }
    @media (max-width:520px){
      body{ padding:1.5rem .9rem }
      #subscribe input[type="email"], #subscribe button{ min-height:36px }
    }

    /* Citations */
    blockquote{ margin:1.75rem 0; padding-left:1.1rem; border-left:2px solid #bbb; font-style:italic; color:#444; line-height:1.6 }
    blockquote footer{ margin-top:.5rem; font-style:normal; font-size:.9em; color:#333 }
    blockquote footer a{ color:#333; text-decoration:underline }
  </style>
</head>

<body>
  <!-- ENTÊTE -->
  <h1 class="site-title">
    <a href="{{ '/' | relative_url }}" title="Revenir à l’accueil">
      <span class="emdash">—</span> Cure
    </a>
  </h1>
  {% if site.description %}<div class="subtitle">{{ site.description }}</div>{% endif %}

  <!-- LISTE AUTOMATIQUE DES CATÉGORIES -->
  {% include categories_list.html %}

  <!-- FORMULAIRE ABONNEMENT -->
  <div id="subscribe">
    <form name="newsletter" method="POST" data-netlify="true" netlify-honeypot="bot-field" action="/confirmation/">
      <input type="hidden" name="form-name" value="newsletter">
      <p style="display:none;"><label>Ne pas remplir : <input name="bot-field"></label></p>

      <label for="email" class="sub-label">Recevoir les nouveaux posts par email :</label>
      <input id="email" name="email" type="email" required placeholder="votre@email.com" aria-label="Adresse email">
      <button type="submit" aria-label="S’abonner">S’abonner</button>
    </form>
  </div>

  <!-- CONTENU DE LA PAGE -->
  <main class="page-content" aria-label="Content">
    {{ content }}
  </main>
</body>
</html>
